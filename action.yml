name: ssh-action-deploy
description: "Deploy has never been so easy, running commands has never been simpler..."
author: "sebastianjnuwu"
branding:
  icon: "terminal"
  color: "purple"

inputs:
  IP:
    description: "The IP address is a unique identifier that identifies a device on the Internet or on a local network."
    required: true
  USER:
    description: "A user is an agent, either a human agent or a software agent, who uses a computer or network service."
    required: true
  KEY:
    description: "Private ssh key used to authenticate (the content of the key). Can be used alone or together with PASSWORD."
    required: false
  PASSWORD:
    description: "SSH password used to authenticate. Can be used alone or together with KEY. sshpass is installed automatically on the runner."
    required: false
  REPO:
    description: "Specify the name of the repository where the action is located."
    default: ${{ github.repository }}
  FOLDER:
    description: 'Optional destination folder, including the user (e.g., "user/deploy"). If empty, no files are copied or deleted; only RUN is executed.'
    required: false
  RUN:
    description: "Specify the commands to be executed after the deploy."
    required: false
  COMPATABILITY:
    description: "Add the '-O' compatability flag to the SCP command for targets with older verions of OPENSSH (ie: Ubuntu 14.X)."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: 🔐 Validating the credentials...
      env:
        SSH_KEY: ${{ inputs.KEY }}
        SSH_PASSWORD: ${{ inputs.PASSWORD }}
      run: |
        if [ -z "$SSH_KEY" ] && [ -z "$SSH_PASSWORD" ]; then
          echo "::error::You must provide at least one authentication method: 'KEY' (private key) or 'PASSWORD' (ssh password)."
          exit 1
        fi
      shell: bash
    - name: 📦 Installing sshpass (password mode)...
      if: inputs.PASSWORD != ''
      env:
        SSH_KEY: ${{ inputs.KEY }}
      run: |
        if command -v sshpass >/dev/null 2>&1; then
          echo "sshpass is already available."
          exit 0
        fi
        SUDO=""
        if [ "$(id -u)" -ne 0 ]; then
          SUDO="sudo"
        fi
        install_sshpass() {
          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq sshpass
          elif command -v apk >/dev/null 2>&1; then
            $SUDO apk add --no-cache sshpass
          elif command -v dnf >/dev/null 2>&1; then
            $SUDO dnf install -y sshpass
          elif command -v yum >/dev/null 2>&1; then
            $SUDO yum install -y sshpass
          elif command -v brew >/dev/null 2>&1; then
            brew install hudochenkov/sshpass/sshpass
          else
            return 1
          fi
        }
        if install_sshpass; then
          echo "sshpass installed."
          exit 0
        fi
        # sshpass could not be installed: if a KEY was also provided, keep
        # going (key auth still works and the password becomes unavailable).
        if [ -n "$SSH_KEY" ]; then
          echo "::warning::Could not install sshpass. Falling back to 'KEY' authentication only."
          exit 0
        fi
        echo "::error::Could not install sshpass. Provide 'KEY' instead or install sshpass manually."
        exit 1
      shell: bash
    - name: 🗿 Creating ssh files...
      if: inputs.KEY != ''
      env:
        SSH_KEY: ${{ inputs.KEY }}
      run: |
        mkdir -p ~/.ssh/
        printf '%s\n' "$SSH_KEY" > ~/.ssh/ssh.key
        chmod 600 ~/.ssh/ssh.key
      shell: bash
    - name: 🍷 Setting the ssh config...
      env:
        SSH_HOST: ${{ inputs.IP }}
        SSH_USER: ${{ inputs.USER }}
        SSH_KEY: ${{ inputs.KEY }}
        SSH_PASSWORD: ${{ inputs.PASSWORD }}
      run: |
        echo "$SSH_HOST"
        mkdir -p ~/.ssh/
        {
          echo "Host ssh"
          echo "  HostName $SSH_HOST"
          echo "  User $SSH_USER"
          echo "  Port 22"
          echo "  StrictHostKeyChecking no"
          echo "  UserKnownHostsFile /dev/null"
          if [ -n "$SSH_KEY" ]; then
            echo "  IdentityFile ~/.ssh/ssh.key"
            echo "  IdentitiesOnly yes"
            if [ -n "$SSH_PASSWORD" ]; then
              echo "  PreferredAuthentications publickey,password"
            fi
          fi
          if [ -z "$SSH_KEY" ] && [ -n "$SSH_PASSWORD" ]; then
            echo "  PreferredAuthentications password"
            echo "  PubkeyAuthentication no"
          fi
        } >> ~/.ssh/config
        chmod 600 ~/.ssh/config
      shell: bash
    - name: 🧭 Validating deploy inputs...
      if: inputs.FOLDER == '' && inputs.RUN == ''
      run: |
        echo "::error::Provide FOLDER, RUN, or both."
        exit 1
      shell: bash
    - name: ✨ Removing old files...
      if: inputs.FOLDER != ''
      env:
        SSH_FOLDER: ${{ inputs.FOLDER }}
        SSHPASS: ${{ inputs.PASSWORD }}
      run: |
        if [ -n "$SSHPASS" ] && command -v sshpass >/dev/null 2>&1; then
          sshpass -e ssh ssh rm -rf "$SSH_FOLDER"
        else
          ssh ssh rm -rf "$SSH_FOLDER"
        fi
      shell: bash
    - name: 💧 deploy to vps...
      if: inputs.FOLDER != '' && inputs.COMPATABILITY != 'true'
      env:
        SSH_REPO: ${{ inputs.REPO }}
        SSH_FOLDER: ${{ inputs.FOLDER }}
        SSHPASS: ${{ inputs.PASSWORD }}
      run: |
        cd ..
        REPO_NAME="${SSH_REPO##*/}"
        echo "enviando: $REPO_NAME -> ssh:$SSH_FOLDER"
        if [ -n "$SSHPASS" ] && command -v sshpass >/dev/null 2>&1; then
          sshpass -e scp -r "$REPO_NAME" "ssh:$SSH_FOLDER"
        else
          scp -r "$REPO_NAME" "ssh:$SSH_FOLDER"
        fi
      shell: bash
    - name: 💧 deploy to vps with compatability...
      if: inputs.FOLDER != '' && inputs.COMPATABILITY == 'true'
      env:
        SSH_REPO: ${{ inputs.REPO }}
        SSH_FOLDER: ${{ inputs.FOLDER }}
        SSHPASS: ${{ inputs.PASSWORD }}
      run: |
        cd ..
        REPO_NAME="${SSH_REPO##*/}"
        echo "enviando: $REPO_NAME -> ssh:$SSH_FOLDER"
        if [ -n "$SSHPASS" ] && command -v sshpass >/dev/null 2>&1; then
          sshpass -e scp -O -r "$REPO_NAME" "ssh:$SSH_FOLDER"
        else
          scp -O -r "$REPO_NAME" "ssh:$SSH_FOLDER"
        fi
      shell: bash
    - name: 🍷 Executing commands...
      if: ${{ inputs.RUN }}
      env:
        SSH_RUN: ${{ inputs.RUN }}
        SSHPASS: ${{ inputs.PASSWORD }}
      run: |
        if [ -n "$SSHPASS" ] && command -v sshpass >/dev/null 2>&1; then
          sshpass -e ssh ssh "$SSH_RUN"
        else
          ssh ssh "$SSH_RUN"
        fi
      shell: bash
