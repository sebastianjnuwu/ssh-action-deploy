name: 🧪 test ssh-action-deploy

on:
  workflow_dispatch:

jobs:
  password:
    name: 🔑 modo senha
    runs-on: ubuntu-latest
    steps:
      - name: 💞 checkout
        uses: actions/checkout@v3
      - name: 🌈 deploy com senha
        uses: ./
        with:
          IP: ${{ secrets.IP_TEST }}
          USER: ${{ secrets.USER_TEST }}
          PASSWORD: ${{ secrets.PASSWORD_TEST }}
          FOLDER: "/tmp/action-test-pass"
          RUN: "echo PASSWORD-OK; whoami; hostname; pwd"

  key:
    name: 🗝️ modo chave
    runs-on: ubuntu-latest
    steps:
      - name: 💞 checkout
        uses: actions/checkout@v3
      - name: 🌈 deploy com chave
        uses: ./
        with:
          IP: ${{ secrets.IP_TEST }}
          USER: ${{ secrets.USER_TEST }}
          KEY: ${{ secrets.KEY_TEST }}
          FOLDER: "/tmp/action-test-key"
          RUN: "echo KEY-OK; whoami; hostname; pwd"
