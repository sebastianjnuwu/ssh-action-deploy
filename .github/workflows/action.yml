name: 🧪 test ssh-action-deploy

on:
  workflow_dispatch:

jobs:
  password:
    name: 🔑 modo senha
    runs-on: ubuntu-latest
    steps:
      - name: 💞 checkout
        uses: actions/checkout@v3
      - name: 🌈 deploy com senha
        uses: ./
        with:
          IP: ${{ secrets.IP }}
          USER: ${{ secrets.USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          FOLDER: "/tmp/action-test-pass"
          RUN: "echo PASSWORD-OK; whoami; hostname; pwd"

  key:
    name: 🗝️ modo chave
    runs-on: ubuntu-latest
    steps:
      - name: 💞 checkout
        uses: actions/checkout@v3
      - name: 🌈 deploy com chave
        uses: ./
        with:
          IP: ${{ secrets.IP }}
          USER: ${{ secrets.USER }}
          KEY: ${{ secrets.KEY }}
          FOLDER: "/tmp/action-test-key"
          RUN: "echo KEY-OK; whoami; hostname; pwd"

  key_and_password:
    name: 🗝️🔑 key + senha juntas
    runs-on: ubuntu-latest
    steps:
      - name: 💞 checkout
        uses: actions/checkout@v3
      - name: 🌈 deploy com key e senha
        uses: ./
        with:
          IP: ${{ secrets.IP }}
          USER: ${{ secrets.USER }}
          KEY: ${{ secrets.KEY }}
          PASSWORD: ${{ secrets.PASSWORD }}
          FOLDER: "/tmp/action-test-both"
          RUN: "echo KEY-AND-PASSWORD-OK; whoami"

  folder_only:
    name: 📁 só pasta (sem cmd)
    runs-on: ubuntu-latest
    steps:
      - name: 💞 checkout
        uses: actions/checkout@v3
      - name: 🌈 deploy só com pasta
        uses: ./
        with:
          IP: ${{ secrets.IP }}
          USER: ${{ secrets.USER }}
          KEY: ${{ secrets.KEY }}
          PASSWORD: ${{ secrets.PASSWORD }}
          FOLDER: "/tmp/action-test-folder-only"

  run_only:
    name: ⚡ só cmd (sem pasta)
    runs-on: ubuntu-latest
    steps:
      - name: 💞 checkout
        uses: actions/checkout@v3
      - name: 🌈 executa só comandos
        uses: ./
        with:
          IP: ${{ secrets.IP }}
          USER: ${{ secrets.USER }}
          KEY: ${{ secrets.KEY }}
          PASSWORD: ${{ secrets.PASSWORD }}
          RUN: "echo RUN-ONLY-OK; uptime"

  neither:
    name: ❌ sem pasta e sem cmd (deve falhar)
    runs-on: ubuntu-latest
    steps:
      - name: 💞 checkout
        uses: actions/checkout@v3
      - name: 🌈 espera erro
        id: expect_fail
        uses: ./
        continue-on-error: true
        with:
          IP: ${{ secrets.IP }}
          USER: ${{ secrets.USER }}
          KEY: ${{ secrets.KEY }}
      - name: 🧪 verifica que falhou
        run: |
          if [ "${{ steps.expect_fail.outcome }}" != "failure" ]; then
            echo "::error::Action should fail when FOLDER and RUN are both empty."
            exit 1
          fi
          echo "OK: falhou como esperado."
